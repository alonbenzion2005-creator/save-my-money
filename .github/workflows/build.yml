name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SaveMyMoney.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SaveMyMoney-apk
          path: SaveMyMoney.apk

      # Keeps one "latest" release with the newest APK, so the phone can always
      # download it from the same link.
      - name: Publish latest APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SaveMyMoney.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Save My Money (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. On your phone, tap SaveMyMoney.apk below to download and install it."
          # gh creates the release as a draft while uploading the APK and then publishes it;
          # once that last step didn't happen, leaving the download link broken. Make sure.
          gh release edit latest --draft=false --latest
          test "$(gh release view latest --json isDraft --jq .isDraft)" = "false"
